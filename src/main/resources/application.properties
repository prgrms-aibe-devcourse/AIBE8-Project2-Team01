spring.application.name=efy
# 기본 프로필은 로컬, 배포에서는 환경변수 SPRING_PROFILES_ACTIVE=prod로 덮어씀
spring.profiles.active=local
# 비밀값은 별도 파일에서 읽음 (없어도 실행되도록 optional)
spring.config.import=optional:classpath:application-secret.properties
# JPA 공통
# 트랜잭션 밖에서 LAZY 연관 접근 막기
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
# data.sql 시드를 테이블 생성 후 실행
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
# JWT 만료 시간 (ms)
# Access 1시간 = 3600000 (개발 1시간, 배포 15분)
jwt.expiration=3600000
# Refresh 14일 = 1209600000 = 14 * 24 * 60 * 60 * 1000
jwt.refresh-expiration=1209600000
# 프론트 주소 (CORS 허용)
app.frontend-url=http://localhost:5173

# 파일 업로드 (파일 1개 5MB, 요청 전체 = 5MB x 10개 + 여유 1MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=51MB
